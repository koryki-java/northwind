rootProject.allprojects {

    version = rootProject.version

    group = rootProject.group

    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:-missing', '-quiet')
    }

    pluginManager.withPlugin('java-base') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }
}

// Shared by every published module (catalog, duckdb); each sets only its artifactId, POM name and
// description. 'fixture' is not published: implementations read it from a checkout (see SPEC.md).
subprojects {
    pluginManager.withPlugin('maven-publish') {
        apply plugin: 'signing'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        // LICENSE and NOTICE in every jar, sources and javadoc included: whoever gets an artifact
        // gets the terms with it. NOTICE also carries the MIT notice for the Northwind-derived
        // content, which the MIT License requires in all copies.
        tasks.withType(Jar).configureEach {
            from(rootProject.file('LICENSE')) { into 'META-INF' }
            from(rootProject.file('NOTICE')) { into 'META-INF' }
        }

        // group+name, so JPMS does not guess the module name from the jar's file name.
        tasks.named('jar') {
            manifest {
                attributes('Automatic-Module-Name': "${project.group}.${project.name}".toString())
            }
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java
                    pom {
                        // A provider, because the module's own 'description = ...' runs after this.
                        description.set(project.provider { project.description })
                        url = 'https://github.com/koryki-java/northwind'
                        licenses {
                            license {
                                name = 'The Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                            }
                        }
                        developers {
                            developer {
                                id = 'j0hannesz'
                                name = 'Johannes Zemlin'
                                email = 'johannes.zemlin@mailbox.org'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/koryki-java/northwind.git'
                            developerConnection = 'scm:git:git@github.com:koryki-java/northwind.git'
                            url = 'https://github.com/koryki-java/northwind'
                        }
                    }
                }
            }
        }

        // Signed only where the keys are set (the release workflow, which checks for them), so
        // publishToMavenLocal works without keys however it is launched.
        def signingKey = providers.environmentVariable('SIGNING_KEY').orNull
        if (signingKey) {
            // Gradle wants the short key ID: eight hex digits. What one has at hand is the
            // fingerprint the way gpg prints it -- forty digits, in spaced groups, sometimes with
            // an 0x in front -- and handing that over fails the release in the signing task with
            // "The key ID must be in a valid form". Its last eight digits ARE the short ID, so
            // reduce it here rather than let the format of a pasted secret stop a release.
            def keyId = providers.environmentVariable('SIGNING_KEY_ID').orNull
                    ?.replaceAll('\\s', '')
                    ?.replaceFirst('(?i)^0x', '')
            if (keyId && keyId.length() > 8) {
                keyId = keyId.substring(keyId.length() - 8)
            }
            def signingPassword = providers.environmentVariable('SIGNING_PASSWORD').orNull
            signing {
                if (keyId) {
                    useInMemoryPgpKeys(keyId, signingKey, signingPassword)
                } else {
                    // No ID given: the key signs with its primary key, which is what this
                    // overload assumes. An unset secret arrives as an empty string, not as null.
                    useInMemoryPgpKeys(signingKey, signingPassword)
                }
                sign publishing.publications.mavenJava
            }
        }
    }
}
