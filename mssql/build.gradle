plugins {
    id 'java'
}

description = 'The Northwind database for SQL Server: DDL, per-table data scripts, constraints, and the ' +
        'builder that loads them into a running server. Not published; run from a checkout.'

sourceSets {
    builder
}

dependencies {
    builderImplementation project(':loader')
    builderRuntimeOnly libs.mssql
}

def scripts = 'src/main/resources/ai/koryki/mssql/databases/northwind/db'

// ./gradlew :mssql:createDatabase
//
// Drops and recreates every Northwind table in the database that mssql.northwind.url points at.
// url, user and password come from ~/.gradle/gradle.properties, as for the koryki core test suites.
tasks.register('createDatabase', JavaExec) {
    group = 'application'
    description = 'Drops and recreates the Northwind tables in the SQL Server database of mssql.northwind.url.'

    classpath = sourceSets.builder.runtimeClasspath
    mainClass = 'ai.koryki.northwind.mssql.BuildNorthwind'
    ['url', 'user', 'password'].each { key ->
        def property = "mssql.northwind.$key".toString()
        if (project.hasProperty(property)) {
            systemProperty property, project.property(property)
        }
    }
    inputs.dir(scripts).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('scripts')
    args file(scripts).path
}

// ./gradlew :mssql:createShared
//
// Creates check_shared, the table of the bed with a concept that columns share, in the database that
// mssql.northwind.url points at. The rest of the Northwind tables stay as they are.
tasks.register('createShared', JavaExec) {
    group = 'application'
    description = 'Creates the check_shared table in the database of mssql.northwind.url.'

    classpath = sourceSets.builder.runtimeClasspath
    mainClass = 'ai.koryki.northwind.mssql.BuildShared'
    ['url', 'user', 'password'].each { key ->
        def property = "mssql.northwind.$key".toString()
        if (project.hasProperty(property)) {
            systemProperty property, project.property(property)
        }
    }
    inputs.dir(scripts).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('scripts')
    args file(scripts).path
}

// ./gradlew :mssql:createComplex
//
// Creates check_complex, the table of the complex-types bed, in the database that
// mssql.northwind.url points at. The rest of the Northwind tables stay as they are.
tasks.register('createComplex', JavaExec) {
    group = 'application'
    description = 'Creates the check_complex table in the database of mssql.northwind.url.'

    classpath = sourceSets.builder.runtimeClasspath
    mainClass = 'ai.koryki.northwind.mssql.BuildComplex'
    ['url', 'user', 'password'].each { key ->
        def property = "mssql.northwind.$key".toString()
        if (project.hasProperty(property)) {
            systemProperty property, project.property(property)
        }
    }
    inputs.dir(scripts).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('scripts')
    args file(scripts).path
}
