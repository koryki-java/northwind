name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # gradle-wrapper.jar is the first thing the build runs: check it against Gradle's published
      # checksums, so a jar swapped in a pull request is caught before it runs.
      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Check formatting
        run: ./gradlew spotlessCheck --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # No pass/fail gate on coverage -- this is visibility, not enforcement -- so it uploads
      # whether the tests passed or not.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: '**/build/reports/jacoco/'
