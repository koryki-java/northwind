plugins {
    id 'java'
    id 'maven-publish'
}

description = 'Schema catalogs for koryki\'s shared test databases -- db.json (physical schema: ' +
        'tables, columns, types, keys) and model.json (semantic layer: entities, attributes, ' +
        'links) -- used to test SQL/KQL query-engine implementations against a common schema.'

dependencies {
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.jackson.databind
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'koryki-northwind-catalog'
            pom {
                name = 'koryki-northwind-catalog'
            }
        }
    }
}
