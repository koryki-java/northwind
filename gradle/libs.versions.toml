[versions]

# Aligned with koryki-java/core.
jackson = "3.2.3"
junit = "6.1.3"
# Builds duckdb/northwind.duckdb. A newer DuckDB may write a storage format the readers in core
# cannot open, so this moves only together with core's duckdb version.
duckdb = "1.5.5.0"
spotless = "8.10.2"
google-java-format = "1.36.1"

[plugins]

spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]

duckdb = { module = "org.duckdb:duckdb_jdbc", version.ref = "duckdb" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" } # version comes from BOM
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" } # version comes from BOM

[bundles]

